[project]
name = "forecast-v3"
version = "0.1.0"
description = "Daily sales forecasting — a project built step by step"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.6,<5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "prophet>=1.4,<2",
    "scikit-learn>=1.7,<2",
    "seaborn>=0.13.2,<0.14",
    "streamlit>=1.64,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "ruff>=0.16.8",
]
